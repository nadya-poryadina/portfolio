<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="-apple-system, 'Onest', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6F9FC"/><stop offset="1" stop-color="#EDF2F8"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#233B5E" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Фон -->
  <g id="bg">
    <rect width="1600" height="900" fill="url(#bg)"/>
    <circle cx="800" cy="450" r="420" fill="none" stroke="#C9D6E8" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="2 10"/>
    <circle cx="800" cy="450" r="300" fill="none" stroke="#C9D6E8" stroke-opacity="0.24" stroke-width="1" stroke-dasharray="2 10"/>
    <g fill="#B9C9DE" opacity="0.5">
      <circle cx="80" cy="110" r="2"/><circle cx="1520" cy="110" r="2"/><circle cx="80" cy="790" r="2"/><circle cx="1520" cy="790" r="2"/>
    </g>
  </g>

  <!-- Петля повторного обращения (4 → 1) -->
  <g id="loop">
    <path d="M 1359 340 C 1290 175, 310 175, 241 340" fill="none" stroke="#8FA8CC" stroke-width="1.6" stroke-dasharray="3 9" stroke-linecap="round"/>
    <circle cx="1359" cy="340" r="4.5" fill="#fff" stroke="#8FA8CC" stroke-width="1.6"/>
    <circle cx="241" cy="340" r="5.5" fill="#fff" stroke="#8FA8CC" stroke-width="1.6"/>
    <text x="800" y="222" text-anchor="middle" font-size="13.5" fill="#64748B" letter-spacing="1">повторное обращение к куратору</text>
  </g>

  <!-- Соединительные линии 1→2→3→4 -->
  <g id="links" fill="none" stroke="#9DB4D6" stroke-width="1.6">
    <path class="link" d="M 400 450 C 420 430, 436 470, 453 450"/>
    <path class="link" d="M 773 450 C 793 430, 809 470, 826 450"/>
    <path class="link" d="M 1146 450 C 1166 430, 1182 470, 1199 450"/>
  </g>
  <g id="nodes" fill="#FFFFFF" stroke="#9DB4D6" stroke-width="1.6">
    <circle class="node" cx="400" cy="450" r="4.5"/><circle class="node" cx="453" cy="450" r="4.5"/>
    <circle class="node" cx="773" cy="450" r="4.5"/><circle class="node" cx="826" cy="450" r="4.5"/>
    <circle class="node" cx="1146" cy="450" r="4.5"/><circle class="node" cx="1199" cy="450" r="4.5"/>
  </g>

  <!-- КАРТОЧКА 1 -->
  <g id="card-1" class="card">
    <rect x="80" y="350" width="320" height="200" rx="24" fill="#FFFFFF" fill-opacity="0.88" stroke="#DCE4EF" stroke-width="1.5" filter="url(#soft)"/>
    <line x1="104" y1="351.5" x2="376" y2="351.5" stroke="#FFFFFF" stroke-width="2" opacity="0.9"/>
    <circle cx="106" cy="382" r="13" fill="#16233A"/>
    <text x="106" y="387" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">1</text>
    <text x="128" y="388" font-size="11.5" letter-spacing="1" fill="#64748B" font-weight="500">КУРАТОР → СТУДЕНТ</text>
    <text x="104" y="432" font-size="17.5" font-weight="600" fill="#16233A">Квитанция<tspan x="104" dy="23">в чате</tspan></text>
    <rect x="104" y="496" width="176" height="30" rx="15" fill="#EEF3FA"/>
    <text x="192" y="515" text-anchor="middle" font-size="12.5" font-weight="500" fill="#33507A">переписка вместо сервиса</text>
    <g transform="translate(290,392)" stroke="#33507A" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="66" height="48" rx="11" fill="#F7FAFD"/>
      <path d="M 15 48 l -6 8 l 12 -8" fill="#F7FAFD"/>
      <g transform="translate(12,11)">
        <rect x="0" y="0" width="28" height="20" rx="4" fill="#fff"/>
        <line x1="5" y1="5.5" x2="23" y2="5.5" stroke="#9DB4D6" stroke-width="1.8"/>
        <line x1="5" y1="10.5" x2="17" y2="10.5" stroke="#9DB4D6" stroke-width="1.8"/>
        <line x1="5" y1="15.5" x2="20" y2="15.5" stroke="#5B8DEF" stroke-width="1.8"/>
      </g>
      <line x1="46" y1="15" x2="58" y2="15" stroke="#9DB4D6" stroke-width="1.8"/>
      <line x1="46" y1="22" x2="54" y2="22" stroke="#9DB4D6" stroke-width="1.8"/>
    </g>
  </g>

  <!-- КАРТОЧКА 2 -->
  <g id="card-2" class="card">
    <rect x="453" y="350" width="320" height="200" rx="24" fill="#FFFFFF" fill-opacity="0.88" stroke="#DCE4EF" stroke-width="1.5" filter="url(#soft)"/>
    <line x1="477" y1="351.5" x2="749" y2="351.5" stroke="#FFFFFF" stroke-width="2" opacity="0.9"/>
    <circle cx="479" cy="382" r="13" fill="#16233A"/>
    <text x="479" y="387" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">2</text>
    <text x="501" y="388" font-size="11.5" letter-spacing="1" fill="#64748B" font-weight="500">СТУДЕНТ → БАНК</text>
    <text x="477" y="432" font-size="17.5" font-weight="600" fill="#16233A">Ручная оплата<tspan x="477" dy="23">в приложении банка</tspan></text>
    <g id="waitPill">
      <rect x="477" y="496" width="132" height="30" rx="15" fill="#EEF3FA"/>
      <text x="543" y="515" text-anchor="middle" font-size="12.5" font-weight="500" fill="#33507A">перевод 1–3 дня</text>
    </g>
    <g transform="translate(650,378)" stroke="#33507A" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="0" width="38" height="68" rx="9" fill="#F7FAFD"/>
      <line x1="19" y1="8" x2="35" y2="8" stroke="#9DB4D6" stroke-width="1.8"/>
      <rect x="14" y="17" width="25" height="9" rx="4.5" fill="#fff" stroke="#9DB4D6" stroke-width="1.6"/>
      <rect x="14" y="30" width="25" height="9" rx="4.5" fill="#fff" stroke="#9DB4D6" stroke-width="1.6"/>
      <rect x="14" y="45" width="17" height="9" rx="4.5" fill="#16233A" stroke="none"/>
      <g id="clock">
        <circle cx="14" cy="14" r="15" fill="#fff" transform="translate(35,38)"/>
        <path d="M 63 58 v 8 l 5 4" stroke="#5B8DEF" stroke-width="2.2"/>
      </g>
    </g>
  </g>

  <!-- КАРТОЧКА 3 -->
  <g id="card-3" class="card">
    <rect x="826" y="350" width="320" height="200" rx="24" fill="#FFFFFF" fill-opacity="0.88" stroke="#DCE4EF" stroke-width="1.5" filter="url(#soft)"/>
    <line x1="850" y1="351.5" x2="1122" y2="351.5" stroke="#FFFFFF" stroke-width="2" opacity="0.9"/>
    <circle cx="852" cy="382" r="13" fill="#16233A"/>
    <text x="852" y="387" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">3</text>
    <text x="874" y="388" font-size="11.5" letter-spacing="1" fill="#64748B" font-weight="500">СТУДЕНТ → КУРАТОР</text>
    <text x="850" y="432" font-size="17.5" font-weight="600" fill="#16233A">Чек — куратору<tspan x="850" dy="23">на проверку</tspan></text>
    <rect x="850" y="496" width="128" height="30" rx="15" fill="#EEF3FA"/>
    <text x="914" y="515" text-anchor="middle" font-size="12.5" font-weight="500" fill="#33507A">ручная сверка</text>
    <g transform="translate(1000,378) scale(1.22)" stroke="#33507A" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 0 4 h 17 l 6 6 v 28 h -23 z" fill="#fff"/>
      <path d="M 17 4 v 6 h 6"/>
      <line x1="5" y1="15" x2="17" y2="15" stroke="#9DB4D6" stroke-width="1.6"/>
      <line x1="5" y1="21" x2="13" y2="21" stroke="#9DB4D6" stroke-width="1.6"/>
      <path d="M 6 29 l 4 4 l 7 -8" stroke="#5B8DEF" stroke-width="2.2"/>
      <path d="M 28 22 h 13" stroke="#9DB4D6"/>
      <path d="M 38 18 l 4 4 l -4 4" stroke="#9DB4D6"/>
      <g transform="translate(42,30)">
        <rect x="0" y="0" width="38" height="29" rx="8" fill="#F7FAFD"/>
        <path d="M 8 29 l -5 6 l 10 -6" fill="#F7FAFD"/>
        <circle cx="8" cy="8" r="3.5" fill="#C9D6E8" stroke="none"/>
        <line x1="15" y1="6" x2="29" y2="6" stroke="#9DB4D6" stroke-width="1.8"/>
        <line x1="15" y1="12" x2="24" y2="12" stroke="#9DB4D6" stroke-width="1.8"/>
      </g>
    </g>
  </g>

  <!-- КАРТОЧКА 4 -->
  <g id="card-4" class="card">
    <rect x="1199" y="350" width="320" height="200" rx="24" fill="#FFFFFF" fill-opacity="0.88" stroke="#DCE4EF" stroke-width="1.5" filter="url(#soft)"/>
    <line x1="1223" y1="351.5" x2="1495" y2="351.5" stroke="#FFFFFF" stroke-width="2" opacity="0.9"/>
    <circle cx="1225" cy="382" r="13" fill="#16233A"/>
    <text x="1225" y="387" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">4</text>
    <text x="1247" y="388" font-size="11.5" letter-spacing="1" fill="#64748B" font-weight="500">СТУДЕНТ ⇄ КУРАТОР</text>
    <text x="1223" y="432" font-size="17.5" font-weight="600" fill="#16233A">Уточнить статус:<tspan x="1223" dy="23">платёж принят?</tspan></text>
    <rect x="1223" y="496" width="156" height="30" rx="15" fill="#EEF3FA"/>
    <text x="1301" y="515" text-anchor="middle" font-size="12.5" font-weight="500" fill="#33507A">в системе статуса нет</text>
    <g transform="translate(1406,396)" stroke="#33507A" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="56" height="43" rx="10" fill="#F7FAFD"/>
      <path d="M 12 43 l -6 8 l 12 -8" fill="#F7FAFD"/>
      <path d="M 24 12 c 0 -5 12 -5 12 1 c 0 4 -6 4 -6 8" stroke="#5B8DEF" stroke-width="2.4"/>
      <circle cx="30" cy="27" r="1.6" fill="#5B8DEF" stroke="none"/>
    </g>
  </g>
</svg>
