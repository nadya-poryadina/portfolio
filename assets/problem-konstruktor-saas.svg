<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 260" font-family="-apple-system, 'Onest', Arial, sans-serif">
  <defs>
    <filter id="lift" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="12" flood-color="#30313B" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- 4 карточки инструментов (разные пути) -->
  <!-- Moodle -->
  <g id="tool-1" class="card">
    <rect x="50" y="20" width="350" height="230" rx="16" fill="#FFFFFF" stroke="#E5E6EB" stroke-width="1.5"/>
    <rect x="70" y="40" width="80" height="20" rx="10" fill="#F4F5F7"/>
    <text x="110" y="54" text-anchor="middle" font-size="10.5" font-weight="600" fill="#858691">ШКОЛА 1</text>
    <text x="70" y="90" font-size="16" font-weight="600" fill="#30313B">Moodle</text>
    <g transform="translate(70,110)">
      <rect x="0" y="0" width="310" height="120" rx="10" fill="#F8F9FB" stroke="#E5E6EB" stroke-width="1.2"/>
      <rect x="0" y="0" width="310" height="24" rx="10" fill="#FFFFFF"/>
      <line x1="0" y1="24" x2="310" y2="24" stroke="#E5E6EB" stroke-width="1"/>
      <rect x="14" y="38" width="130" height="32" rx="6" fill="#FFFFFF" stroke="#E5E6EB" stroke-width="1"/>
      <rect x="22" y="45" width="80" height="8" rx="4" fill="#EDEDF0"/>
      <rect x="22" y="57" width="56" height="6" rx="3" fill="#EDEDF0"/>
      <rect x="158" y="38" width="130" height="32" rx="6" fill="#FFFFFF" stroke="#E5E6EB" stroke-width="1"/>
      <rect x="166" y="45" width="90" height="8" rx="4" fill="#EDEDF0"/>
      <rect x="166" y="57" width="60" height="6" rx="3" fill="#EDEDF0"/>
      <rect x="14" y="82" width="274" height="26" rx="6" fill="#FFFFFF" stroke="#E5E6EB" stroke-width="1"/>
      <rect x="22" y="89" width="70" height="8" rx="4" fill="#EDEDF0"/>
    </g>
  </g>

  <!-- Excel -->
  <g id="tool-2" class="card">
    <rect x="440" y="20" width="350" height="230" rx="16" fill="#FFFFFF" stroke="#E5E6EB" stroke-width="1.5"/>
    <rect x="460" y="40" width="80" height="20" rx="10" fill="#F4F5F7"/>
    <text x="500" y="54" text-anchor="middle" font-size="10.5" font-weight="600" fill="#858691">ШКОЛА 2</text>
    <text x="460" y="90" font-size="16" font-weight="600" fill="#30313B">Excel</text>
    <g transform="translate(460,110)">
      <rect x="0" y="0" width="310" height="120" rx="10" fill="#F8F9FB" stroke="#E5E6EB" stroke-width="1.2"/>
      <rect x="14" y="12" width="282" height="20" rx="4" fill="#EDEDF0"/>
      <line x1="108" y1="12" x2="108" y2="106" stroke="#E5E6EB" stroke-width="1"/>
      <line x1="202" y1="12" x2="202" y2="106" stroke="#E5E6EB" stroke-width="1"/>
      <line x1="14" y1="46" x2="296" y2="46" stroke="#E5E6EB" stroke-width="1"/>
      <line x1="14" y1="66" x2="296" y2="66" stroke="#E5E6EB" stroke-width="1"/>
      <line x1="14" y1="86" x2="296" y2="86" stroke="#E5E6EB" stroke-width="1"/>
      <rect x="20" y="16" width="56" height="6" rx="3" fill="#D6D7DE"/>
      <rect x="114" y="16" width="56" height="6" rx="3" fill="#D6D7DE"/>
      <rect x="208" y="16" width="56" height="6" rx="3" fill="#D6D7DE"/>
      <rect x="20" y="52" width="46" height="6" rx="3" fill="#EDEDF0"/>
      <rect x="114" y="52" width="52" height="6" rx="3" fill="#EDEDF0"/>
      <rect x="208" y="52" width="44" height="6" rx="3" fill="#EDEDF0"/>
      <rect x="20" y="72" width="50" height="6" rx="3" fill="#EDEDF0"/>
      <rect x="114" y="72" width="46" height="6" rx="3" fill="#EDEDF0"/>
      <rect x="208" y="72" width="48" height="6" rx="3" fill="#EDEDF0"/>
      <rect x="20" y="92" width="42" height="6" rx="3" fill="#EDEDF0"/>
      <rect x="114" y="92" width="54" height="6" rx="3" fill="#EDEDF0"/>
      <rect x="208" y="92" width="38" height="6" rx="3" fill="#EDEDF0"/>
    </g>
  </g>

  <!-- Google Диск -->
  <g id="tool-3" class="card">
    <rect x="830" y="20" width="350" height="230" rx="16" fill="#FFFFFF" stroke="#E5E6EB" stroke-width="1.5"/>
    <rect x="850" y="40" width="80" height="20" rx="10" fill="#F4F5F7"/>
    <text x="890" y="54" text-anchor="middle" font-size="10.5" font-weight="600" fill="#858691">ШКОЛА 3</text>
    <text x="850" y="90" font-size="16" font-weight="600" fill="#30313B">Google Диск</text>
    <g transform="translate(850,110)">
      <rect x="0" y="0" width="310" height="120" rx="10" fill="#F8F9FB" stroke="#E5E6EB" stroke-width="1.2"/>
      <path d="M 14 14 h 50 l 8 10 h 54 v 50 h -112 z" fill="#EDEDF0"/>
      <g transform="translate(150,14)">
        <path d="M 0 0 h 26 l 8 8 v 36 h -34 z" fill="#FFFFFF" stroke="#E5E6EB" stroke-width="1.2"/>
        <path d="M 26 0 v 8 h 8" fill="none" stroke="#E5E6EB" stroke-width="1.2"/>
        <line x1="6" y1="16" x2="22" y2="16" stroke="#EDEDF0" stroke-width="2"/>
      </g>
      <g transform="translate(200,14)">
        <path d="M 0 0 h 26 l 8 8 v 36 h -34 z" fill="#FFFFFF" stroke="#E5E6EB" stroke-width="1.2"/>
        <path d="M 26 0 v 8 h 8" fill="none" stroke="#E5E6EB" stroke-width="1.2"/>
        <line x1="6" y1="16" x2="20" y2="16" stroke="#EDEDF0" stroke-width="2"/>
      </g>
      <g transform="translate(250,14)">
        <path d="M 0 0 h 26 l 8 8 v 36 h -34 z" fill="#FFFFFF" stroke="#E5E6EB" stroke-width="1.2"/>
      </g>
      <path d="M 14 76 h 60 l 8 10 h 60 v 30 h -128 z" fill="#EDEDF0"/>
      <g transform="translate(170,76)">
        <path d="M 0 0 h 24 l 7 7 v 32 h -31 z" fill="#FFFFFF" stroke="#E5E6EB" stroke-width="1.2"/>
      </g>
      <g transform="translate(215,76)">
        <path d="M 0 0 h 24 l 7 7 v 32 h -31 z" fill="#FFFFFF" stroke="#E5E6EB" stroke-width="1.2"/>
      </g>
    </g>
  </g>

  <!-- Яндекс Диск -->
  <g id="tool-4" class="card">
    <rect x="1220" y="20" width="350" height="230" rx="16" fill="#FFFFFF" stroke="#E5E6EB" stroke-width="1.5"/>
    <rect x="1240" y="40" width="80" height="20" rx="10" fill="#F4F5F7"/>
    <text x="1280" y="54" text-anchor="middle" font-size="10.5" font-weight="600" fill="#858691">ШКОЛА 4</text>
    <text x="1240" y="90" font-size="16" font-weight="600" fill="#30313B">Яндекс Диск</text>
    <g transform="translate(1240,110)">
      <rect x="0" y="0" width="310" height="120" rx="10" fill="#F8F9FB" stroke="#E5E6EB" stroke-width="1.2"/>
      <g transform="translate(115,8)">
        <path d="M 20 36 a 18 18 0 0 1 0 -36 a 22 22 0 0 1 42 -5 a 16 16 0 0 1 24 14 a 14 14 0 0 1 -4 27 z" fill="#EDEDF0"/>
        <line x1="38" y1="42" x2="38" y2="50" stroke="#D6D7DE" stroke-width="2" stroke-linecap="round"/>
        <line x1="47" y1="42" x2="47" y2="50" stroke="#D6D7DE" stroke-width="2" stroke-linecap="round"/>
        <line x1="56" y1="42" x2="56" y2="50" stroke="#D6D7DE" stroke-width="2" stroke-linecap="round"/>
      </g>
      <g stroke="#D6D7DE" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 30 72 v 14 m 0 0 l -5 -6 m 5 6 l 5 -6"/>
        <path d="M 280 72 v 14 m 0 0 l -5 -6 m 5 6 l 5 -6"/>
      </g>
      <g transform="translate(14,66)">
        <path d="M 0 0 h 22 l 7 7 v 30 h -29 z" fill="#FFFFFF" stroke="#E5E6EB" stroke-width="1.2"/>
      </g>
      <g transform="translate(54,66)">
        <path d="M 0 0 h 22 l 7 7 v 30 h -29 z" fill="#FFFFFF" stroke="#E5E6EB" stroke-width="1.2"/>
      </g>
      <g transform="translate(260,66)">
        <path d="M 0 0 h 22 l 7 7 v 30 h -29 z" fill="#FFFFFF" stroke="#E5E6EB" stroke-width="1.2"/>
      </g>
      <g transform="translate(275,66)">
        <path d="M 0 0 h 22 l 7 7 v 30 h -29 z" fill="#FFFFFF" stroke="#E5E6EB" stroke-width="1.2"/>
      </g>
    </g>
  </g>

</svg>
