<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="-apple-system, 'Onest', Arial, sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#22262B" flood-opacity="0.07"/>
    </filter>
  </defs>

  <!-- Петля лишнего круга -->
  <path d="M 1029 58 C 1029 10, 171 10, 174 52" fill="none" stroke="#ED131C" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round"/>
  <path d="M 174 52 l -8.5 -8 M 174 52 l 10.5 -4.5" stroke="#ED131C" stroke-width="2" fill="none" stroke-linecap="round"/>
  <rect x="512" y="6" width="176" height="26" rx="13" fill="#FDE9EA"/>
  <text x="600" y="23" text-anchor="middle" font-size="12.5" font-weight="600" fill="#ED131C">лишний круг переписки</text>

  <!-- Стрелки -->
  <g stroke="#C9CDD3" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 306 210 h 14"/><path d="M 320 210 l -7 -6 m 7 6 l -7 6"/>
    <path d="M 592 210 h 14"/><path d="M 606 210 l -7 -6 m 7 6 l -7 6"/>
    <path d="M 878 210 h 14"/><path d="M 892 210 l -7 -6 m 7 6 l -7 6"/>
  </g>
  <g font-size="11" fill="#8B9096" text-anchor="middle">
    <text x="313" y="192">чат</text>
    <text x="599" y="192">1–3 дня</text>
    <text x="885" y="192">ожидание</text>
  </g>

  <!-- КАРТОЧКА 1 -->
  <g>
    <rect x="40" y="62" width="262" height="296" rx="16" fill="#FFFFFF" stroke="#E7E9EC" stroke-width="1.5" filter="url(#sh)"/>
    <circle cx="64" cy="90" r="13" fill="#252525"/>
    <text x="64" y="95" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">1</text>

    <!-- сцена: чат с квитанцией -->
    <g transform="translate(94,116)">
      <rect x="0" y="0" width="86" height="66" rx="12" fill="#F7F8FA" stroke="#D9DBDF" stroke-width="1.6"/>
      <path d="M 18 66 l -6 9 l 13 -9" fill="#F7F8FA"/>
      <circle cx="16" cy="17" r="7" fill="#C9CDD3"/>
      <rect x="29" y="10" width="46" height="13" rx="6.5" fill="#E7E9EC"/>
      <g transform="translate(14,31)">
        <rect x="0" y="0" width="36" height="25" rx="5" fill="#FFFFFF" stroke="#D9DBDF" stroke-width="1.4"/>
        <line x1="6" y1="7" x2="30" y2="7" stroke="#C9CDD3" stroke-width="1.8"/>
        <line x1="6" y1="13" x2="22" y2="13" stroke="#C9CDD3" stroke-width="1.8"/>
        <line x1="6" y1="19" x2="26" y2="19" stroke="#ED131C" stroke-width="1.8"/>
      </g>
      <circle cx="74" cy="54" r="10" fill="#ED131C"/>
      <path d="M 70 54 h.5 M 74 54 h.5 M 78 54 h.5" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
    </g>

    <text x="60" y="248" font-size="14.5" font-weight="600" fill="#22262B">Куратор присылает<tspan x="60" dy="19">квитанцию в чат</tspan></text>
    <rect x="60" y="304" width="158" height="28" rx="14" fill="#FDE9EA"/>
    <text x="139" y="322" text-anchor="middle" font-size="12" font-weight="500" fill="#ED131C">вся история — в переписке</text>
  </g>

  <!-- КАРТОЧКА 2 -->
  <g>
    <rect x="326" y="62" width="262" height="296" rx="16" fill="#FFFFFF" stroke="#E7E9EC" stroke-width="1.5" filter="url(#sh)"/>
    <circle cx="350" cy="90" r="13" fill="#252525"/>
    <text x="350" y="95" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">2</text>

    <!-- сцена: форма реквизитов -->
    <g transform="translate(368,110)">
      <rect x="0" y="0" width="92" height="74" rx="11" fill="#F7F8FA" stroke="#D9DBDF" stroke-width="1.6"/>
      <rect x="10" y="10" width="72" height="13" rx="5" fill="#E7E9EC"/>
      <rect x="10" y="31" width="44" height="13" rx="6.5" fill="#fff" stroke="#C9CDD3" stroke-width="1.4"/>
      <rect x="10" y="50" width="44" height="13" rx="6.5" fill="#fff" stroke="#C9CDD3" stroke-width="1.4"/>
      <path d="M 49 35 l -3.5 3.5 l 3.5 3.5" stroke="#8B9096" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 49 54 l -3.5 3.5 l 3.5 3.5" stroke="#8B9096" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="63" y="31" width="18" height="32" rx="5" fill="#252525"/>
      <path d="M 72 43 v 8 M 68 47 l 4 4 l 4 -4" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="346" y="248" font-size="14.5" font-weight="600" fill="#22262B">Ручной ввод реквизитов<tspan x="346" dy="19">в приложении банка</tspan></text>
    <rect x="346" y="304" width="150" height="28" rx="14" fill="#FDE9EA"/>
    <text x="421" y="322" text-anchor="middle" font-size="12" font-weight="500" fill="#ED131C">перевод идёт 1–3 дня</text>
  </g>

  <!-- КАРТОЧКА 3 -->
  <g>
    <rect x="612" y="62" width="262" height="296" rx="16" fill="#FFFFFF" stroke="#E7E9EC" stroke-width="1.5" filter="url(#sh)"/>
    <circle cx="636" cy="90" r="13" fill="#252525"/>
    <text x="636" y="95" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">3</text>

    <!-- сцена: чек улетает в чат куратору -->
    <g transform="translate(652,112)">
      <path d="M 2 2 h 26 l 8 8 v 44 h -34 z" fill="#fff" stroke="#C9CDD3" stroke-width="1.8"/>
      <path d="M 28 2 v 8 h 8" fill="none" stroke="#C9CDD3" stroke-width="1.8"/>
      <line x1="9" y1="18" x2="27" y2="18" stroke="#E7E9EC" stroke-width="2"/>
      <line x1="9" y1="25" x2="22" y2="25" stroke="#E7E9EC" stroke-width="2"/>
      <path d="M 10 38 l 5 5 l 10 -11" stroke="#ED131C" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <g stroke="#8B9096" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 43 26 h 24"/><path d="M 61 20 l 6 6 l -6 6"/>
      </g>
      <g transform="translate(64,36)">
        <rect x="0" y="0" width="58" height="44" rx="10" fill="#F7F8FA" stroke="#D9DBDF" stroke-width="1.6"/>
        <path d="M 12 44 l -6 8 l 13 -8" fill="#F7F8FA"/>
        <circle cx="11" cy="12" r="6" fill="#C9CDD3"/>
        <rect x="23" y="6" width="28" height="11" rx="5.5" fill="#E7E9EC"/>
        <g transform="translate(10,24)">
          <rect x="0" y="0" width="22" height="15" rx="3.5" fill="#FFFFFF" stroke="#D9DBDF" stroke-width="1.2"/>
          <path d="M 5 7.5 l 3 3 l 6 -7" stroke="#ED131C" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>
    </g>

    <text x="632" y="248" font-size="14.5" font-weight="600" fill="#22262B">Чек — куратору<tspan x="632" dy="19">на проверку</tspan></text>
    <rect x="632" y="304" width="140" height="28" rx="14" fill="#FDE9EA"/>
    <text x="702" y="322" text-anchor="middle" font-size="12" font-weight="500" fill="#ED131C">ручная сверка чека</text>
  </g>

  <!-- КАРТОЧКА 4 -->
  <g>
    <rect x="898" y="62" width="262" height="296" rx="16" fill="#FFFFFF" stroke="#E7E9EC" stroke-width="1.5" filter="url(#sh)"/>
    <circle cx="922" cy="90" r="13" fill="#252525"/>
    <text x="922" y="95" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">4</text>

    <!-- сцена: чат с песочными часами -->
    <g transform="translate(950,114)">
      <rect x="0" y="0" width="86" height="64" rx="12" fill="#F7F8FA" stroke="#D9DBDF" stroke-width="1.6"/>
      <path d="M 18 64 l -6 9 l 13 -9" fill="#F7F8FA"/>
      <g transform="translate(31,12)" stroke="#ED131C" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 0 0 h 24 M 0 40 h 24"/>
        <path d="M 2 0 c 0 10 9 12 10 20 c 1 -8 10 -10 10 -20"/>
        <path d="M 12 17 v 9" stroke-width="2" stroke-linecap="round"/>
        <circle cx="12" cy="32" r="1.6" fill="#ED131C" stroke="none"/>
      </g>
    </g>

    <text x="918" y="248" font-size="14.5" font-weight="600" fill="#22262B">Уточнить:<tspan x="918" dy="19">всё ли в порядке?</tspan></text>
    <rect x="918" y="304" width="142" height="28" rx="14" fill="#FDE9EA"/>
    <text x="989" y="322" text-anchor="middle" font-size="12" font-weight="500" fill="#ED131C">статус неизвестен</text>
  </g>
</svg>
