<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -40 1180 350" font-family="-apple-system, 'Onest', Arial, sans-serif">
  <!-- Петля «лишний круг» -->
  <path d="M 1050 24 C 1050 -18, 150 -18, 152 20" fill="none" stroke="#ED131C" stroke-width="2" stroke-dasharray="6 6" stroke-linecap="round"/>
  <path d="M 152 20 l -7 -10 M 152 20 l 10 -7" stroke="#ED131C" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="600" y="-14" text-anchor="middle" font-size="13" font-weight="500" fill="#ED131C">лишний круг переписки</text>

  <!-- Стрелки между шагами -->
  <g stroke="#C6CAD0" stroke-width="2.5" fill="none" stroke-linecap="round">
    <line x1="284" y1="128" x2="312" y2="128"/><path d="M 312 128 l -8 -6 M 312 128 l -8 6"/>
    <line x1="584" y1="128" x2="612" y2="128"/><path d="M 612 128 l -8 -6 M 612 128 l -8 6"/>
    <line x1="884" y1="128" x2="912" y2="128"/><path d="M 912 128 l -8 -6 M 912 128 l -8 6"/>
  </g>

  <!-- Шаг 1 -->
  <g>
    <rect x="20" y="36" width="264" height="184" rx="14" fill="#FFFFFF" stroke="#E4E6EA" stroke-width="1.5"/>
    <text x="40" y="64" font-size="12" letter-spacing="1.5" fill="#8B9096" font-weight="600">ШАГ 1</text>
    <g transform="translate(40,84)" stroke="#6B7280" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="40" height="28" rx="8"/>
      <path d="M 10 40 l -5 8 l 12 -8"/>
      <line x1="9" y1="10" x2="31" y2="10"/><line x1="9" y1="18" x2="24" y2="18"/>
    </g>
    <text x="100" y="94" font-size="15" font-weight="500" fill="#22262B">Куратор присылает<tspan x="100" dy="20">квитанцию в чат</tspan></text>
    <rect x="40" y="164" width="176" height="32" rx="16" fill="#FDE9EA"/>
    <text x="128" y="184" text-anchor="middle" font-size="12.5" font-weight="500" fill="#ED131C">всё живёт в переписке</text>
  </g>

  <!-- Шаг 2 -->
  <g>
    <rect x="320" y="36" width="264" height="184" rx="14" fill="#FFFFFF" stroke="#E4E6EA" stroke-width="1.5"/>
    <text x="340" y="64" font-size="12" letter-spacing="1.5" fill="#8B9096" font-weight="600">ШАГ 2</text>
    <g transform="translate(340,84)" stroke="#6B7280" stroke-width="2.4" fill="none" stroke-linecap="round">
      <rect x="0" y="0" width="42" height="30" rx="6"/>
      <line x1="0" y1="9" x2="42" y2="9"/>
      <line x1="7" y1="17" x2="24" y2="17"/><line x1="7" y1="24" x2="30" y2="24"/>
    </g>
    <text x="400" y="94" font-size="15" font-weight="500" fill="#22262B">Студент вручную вводит<tspan x="400" dy="20">реквизиты в банке</tspan></text>
    <rect x="340" y="164" width="186" height="32" rx="16" fill="#FDE9EA"/>
    <text x="433" y="184" text-anchor="middle" font-size="12.5" font-weight="500" fill="#ED131C">перевод идёт до 3 дней</text>
  </g>

  <!-- Шаг 3 -->
  <g>
    <rect x="620" y="36" width="264" height="184" rx="14" fill="#FFFFFF" stroke="#E4E6EA" stroke-width="1.5"/>
    <text x="640" y="64" font-size="12" letter-spacing="1.5" fill="#8B9096" font-weight="600">ШАГ 3</text>
    <g transform="translate(640,82)" stroke="#6B7280" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 4 2 h 26 l 8 8 v 28 h -34 z"/>
      <path d="M 30 2 v 8 h 8"/>
      <path d="M 11 22 l 6 6 l 11 -12" stroke="#ED131C"/>
    </g>
    <text x="700" y="94" font-size="15" font-weight="500" fill="#22262B">Студент отправляет<tspan x="700" dy="20">чек куратору</tspan></text>
    <rect x="640" y="164" width="176" height="32" rx="16" fill="#FDE9EA"/>
    <text x="728" y="184" text-anchor="middle" font-size="12.5" font-weight="500" fill="#ED131C">ручная проверка чека</text>
  </g>

  <!-- Шаг 4 -->
  <g>
    <rect x="920" y="36" width="264" height="184" rx="14" fill="#FFFFFF" stroke="#E4E6EA" stroke-width="1.5"/>
    <text x="940" y="64" font-size="12" letter-spacing="1.5" fill="#8B9096" font-weight="600">ШАГ 4</text>
    <g transform="translate(940,82)" stroke="#6B7280" stroke-width="2.4" fill="none" stroke-linecap="round">
      <circle cx="21" cy="20" r="20"/>
      <path d="M 14 16 c 0 -6 14 -6 14 1 c 0 5 -7 4 -7 10" stroke="#ED131C"/>
      <circle cx="21" cy="34" r="1.6" fill="#ED131C" stroke="none"/>
    </g>
    <text x="1000" y="94" font-size="15" font-weight="500" fill="#22262B">Студент уточняет,<tspan x="1000" dy="20">всё ли в порядке</tspan></text>
    <rect x="940" y="164" width="164" height="32" rx="16" fill="#FDE9EA"/>
    <text x="1022" y="184" text-anchor="middle" font-size="12.5" font-weight="500" fill="#ED131C">статус неизвестен</text>
  </g>
</svg>
